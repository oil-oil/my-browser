<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Local Browser Operator Lab</title>
    <style>
      body {
        font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 24px;
        color: #222;
        background: #fafafa;
      }

      main {
        max-width: 760px;
        margin: 0 auto;
      }

      button {
        border: 1px solid #222;
        border-radius: 6px;
        background: #222;
        color: #fff;
        padding: 8px 12px;
        font: inherit;
        cursor: pointer;
      }

      button.secondary {
        background: #fff;
        color: #222;
      }

      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 12px 0;
      }

      pre {
        overflow: auto;
        border: 1px solid #ddd;
        border-radius: 6px;
        background: #fff;
        padding: 12px;
        min-height: 160px;
      }

      .status {
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Local Browser Operator Lab</h1>
      <p>The background operator polls the local agent and executes approved commands in this Chrome profile. This page only shows status and manual recovery controls.</p>
      <div class="row">
        <button id="connect">Connect to Local Agent</button>
        <button id="attach" class="secondary">Attach Active Tab</button>
        <button id="detach" class="secondary">Detach</button>
      </div>
      <p class="status" id="status">Idle</p>
      <pre id="log"></pre>
    </main>
    <script src="operator.js"></script>
  </body>
</html>
